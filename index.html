const PT=[['P-1042','M. Ali · 46 M','Karachi West · BMU 14','Cough > 3 weeks, night sweats, weight loss',92,'Xpert MTB/RIF: MTB detected (high); rifampicin resistance not detected','No previous TB treatment · household contact of a TB case (2025)'],['P-1043','S. Bibi · 29 F','Larkana · BMU 6','Persistent cough, low-grade fever',67,'Smear microscopy 1+ AFB · Xpert pending','Treated for pneumonia two months ago'],['P-1044','R. Kumar · 8 M','Tharparkar · BMU 3','Weight loss, contact with a TB case',41,'Chest X-ray: possible hilar lymphadenopathy','BCG vaccinated · household contact under evaluation'],['P-1045','A. Shaikh · 58 M','Sukkur · BMU 9','Chronic cough, diabetes',18,'Xpert MTB/RIF: MTB not detected','TB treatment completed in 2019']];
function aiPage(){const p=PT[PI],C=(x,y,t,b)=>`<div class="ac" style="left:${x}px;top:${y}px"><h3>${t}</h3>${b}</div>`;
 pages[7].innerHTML=`<div class="abs" style="left:350px;top:96px;display:flex;gap:10px;align-items:center;color:#fff;font-size:15px">${PT.map((q,i)=>`<span class="chip${i==PI?' on':''}" onclick="PI=${i};aiPage()">${q[0]}</span>`).join('')}<span class="chip run" onclick="runAI()">▶ Run TB-AI</span></div>`+
 C(350,150,'Patient information',`<b>${p[0]}</b> · ${p[1]}<br>${p[2]}<br><br>Presenting symptoms:<br>${p[3]}`)+
 C(910,150,'TB-AI output',`<div id="sc" class="big2">0%</div>TB probability score<div class="bt"><i id="bar"></i></div><span id="vd"></span>`)+
 C(350,470,'Laboratory result',p[5])+C(910,470,'Previous history',p[6]);runAI()}
function runAI(){const t=PT[PI][4],v=$('#vd');v.textContent=t>=70?'High probability — refer for confirmatory testing':t>=40?'Moderate — clinical review advised':'Low probability — routine follow-up';$('#bar').style.background=t>=70?'#ff3131':t>=40?'#ffa53a':'#4be08a';let n=0;clearInterval(AT);AT=setInterval(()=>{n=Math.min(t,n+3);$('#sc').textContent=n+'%';$('#bar').style.width=n+'%';if(n>=t)clearInterval(AT)},16)}

/* ---------- Geospatial heatmapping ---------- */
const S=128,X0=405,Y0=110,P=(lo,la)=>[X0+(lo-66.5)*.9*S,Y0+(28.8-la)*S],OP=OUT.map(p=>P(...p));
const OD='M'+OP.map(p=>p.map(v=>v.toFixed(1))).join('L')+'Z';
const clip=(pl,a,b,c)=>{const o=[];pl.forEach((p,k)=>{const q=pl[(k+1)%pl.length],fp=a*p[0]+b*p[1]-c,fq=a*q[0]+b*q[1]-c;if(fp<=0)o.push(p);if(fp*fq<0){const t=fp/(fp-fq);o.push([p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])])}});return o};
// schematic district boundaries: Voronoi cells of the district seats, clipped to the outline
const CELLS=SITES.map((s,i)=>{let pl=OP;const a=P(s[1],s[2]);SITES.forEach((t,j)=>{if(j!=i){const b=P(t[1],t[2]);pl=clip(pl,2*(b[0]-a[0]),2*(b[1]-a[1]),b[0]**2+b[1]**2-a[0]**2-a[1]**2)}});return pl});
const RP=[[74,63,224],[127,230,250],[217,255,0]];
const col=t=>{t=Math.max(0,Math.min(1,t));const s=t*2,i=Math.min(1,s|0),f=s-i,a=RP[i],b=RP[i+1];return`rgb(${a.map((v,k)=>Math.round(v+(b[k]-v)*f))})`};
const area=p=>Math.abs(p.reduce((a,q,k)=>{const r=p[(k+1)%p.length];return a+q[0]*r[1]-r[0]*q[1]},0))/2;
const shortN=n=>n.replace('Shaheed Benazirabad','S. Benazirabad').replace('Muhammad','M.').replace('Naushahro Feroze','N. Feroze').replace('Kambar Shahdadkot','Kambar-Shahdadkot');
const setMet=m=>{MET=m;upd()},setSec=s=>{SEC=s;upd()},tglHeat=()=>{HEATON=!HEATON;upd()},selD=i=>{SEL=i;upd()};
let built=0;
function mapPage(){if(!built){built=1;const cen=p=>[p.reduce((a,q)=>a+q[0],0)/p.length,p.reduce((a,q)=>a+q[1],0)/p.length];
 pages[6].innerHTML=`<svg class="abs" style="left:0;top:0;pointer-events:none" width="1456" height="819"><defs><clipPath id="cp"><path d="${OD}"/></clipPath><filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="13"/></filter><filter id="gl"><feGaussianBlur stdDeviation="7"/></filter></defs><path d="${OD}" fill="none" stroke="#7fe6fa" stroke-width="8" opacity=".45" filter="url(#gl)"/><g id="cells">${CELLS.map((p,i)=>`<path data-i="${i}" d="M${p.map(q=>q.map(v=>v.toFixed(1))).join('L')}Z" stroke-linejoin="round" style="cursor:pointer"/>`).join('')}</g><g id="heat" clip-path="url(#cp)" filter="url(#bl)"></g><path d="${OD}" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><g>${CELLS.map((p,i)=>area(p)>1500?`<text class="lb" x="${cen(p)[0].toFixed(0)}" y="${cen(p)[1].toFixed(0)}" text-anchor="middle">${shortN(SITES[i][0])}</text>`:'').join('')}<text x="${P(66.55,24.5)[0]}" y="${P(66.55,24.5)[1]}" fill="#fff" font-size="13" opacity=".85">Karachi ▸</text></g><g id="pulse"></g></svg><div id="side"></div><div id="tip"></div>`;
 const c=$('#cells'),tip=$('#tip');c.onmousemove=e=>{const i=e.target.dataset.i;if(i==null){tip.style.display='none';return}const d=data(SEC)[i],r=$('#stage').getBoundingClientRect();tip.innerHTML=`<b>${d.n}</b><br>${MT[MET][0]}: ${MT[MET][2](d[MET])}<br>TB positive: ${d.pos.toLocaleString()}`;tip.style.display='block';tip.style.left=(e.clientX-r.left)/SC+16+'px';tip.style.top=(e.clientY-r.top)/SC+12+'px'};
 c.onmouseleave=()=>tip.style.display='none';c.onclick=e=>{if(e.target.dataset.i!=null)selD(+e.target.dataset.i)}}
 upd()}
function upd(){const D=data(SEC),v=D.map(d=>d[MET]),mn=Math.min(...v),mx=Math.max(...v),nz=x=>(x-mn)/(mx-mn||1),M=MT[MET],mp=Math.max(...D.map(d=>d.pos)),xy=d=>P(SITES[d.id][1],SITES[d.id][2]);
 document.querySelectorAll('#cells path').forEach(p=>{const i=p.dataset.i,s=i==SEL;p.setAttribute('fill',col(nz(D[i][MET])));p.setAttribute('stroke',s?'#fff':'rgba(255,255,255,.5)');p.setAttribute('stroke-width',s?3.2:1);if(s)p.parentNode.appendChild(p)});
 $('#heat').innerHTML=HEATON?D.map(d=>{const t=d.pos/mp,[x,y]=xy(d);return`<circle cx="${x}" cy="${y}" r="${14+t*38}" fill="#ff1a1a" opacity="${.2+.65*t}"/>`}).join(''):'';
 $('#pulse').innerHTML=HEATON?D.slice().sort((a,b)=>b.pos-a.pos).slice(0,3).map(d=>{const[x,y]=xy(d);return`<circle cx="${x}" cy="${y}" r="4" fill="#ff3131" stroke="#fff"><animate attributeName="r" values="4;16" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="${x}" cy="${y}" r="4" fill="#ff3131" stroke="#fff"/>`}).join(''):'';
 const ch=(f,l,on)=>`<span class="chip${on?' on':''}" onclick="${f}">${l}</span>`,d=D[SEL],L=x=>x.toLocaleString(),top=D.slice().sort((a,b)=>(b[MET]-a[MET])*(M[1]?-1:1)).slice(0,5);
 const sp=d?Array.from({length:12},(_,m)=>d.pos/12*(.7+rnd(SEL+1,30+m)*.6)):[],sm=Math.max(...sp,1);
 const card=d?`<div class="card"><b style="font-size:17px">${d.n}</b> <span style="opacity:.7">· ${SEC}</span><div class="gr">${[['Suspects',L(d.sus)],['Tested',L(d.tested)],['TB positive',L(d.pos)],['Positivity',d.pr.toFixed(1)+'%'],['Started tx',d.stp.toFixed(0)+'%'],['Success',d.su.toFixed(0)+'%'],['LTFU',d.ltfu.toFixed(1)+'%'],['Median TAT',d.tat.toFixed(1)+' d'],['MDR/RR-TB',d.mdr],['AI tests',L(d.ai)],['Active BMUs',d.bmu],['Coverage',d.cov.toFixed(0)+'%']].map(x=>`<span>${x[0]}<b>${x[1]}</b></span>`).join('')}</div><svg width="410" height="38"><polyline fill="none" stroke="#7fe6fa" stroke-width="2.5" points="${sp.map((y,k)=>`${k*37+4},${34-y/sm*30}`).join(' ')}"/></svg><span style="opacity:.6;font-size:11px">12-month cases trend (illustrative)</span></div>`:`<div class="card" style="opacity:.75">Click a district to open its detail card.</div>`;
 $('#side').innerHTML=`<div style="color:#ff3131;font-size:38px;font-weight:600;line-height:44px">CASE SPOTTING</div><div class="sh">Sector</div><div class="cr">${['All','Public','Private','PPM'].map(s=>ch(`setSec('${s}')`,s,s==SEC)).join('')}${ch('tglHeat()','● Heat layer',HEATON)}</div><div class="sh">Indicator</div><div class="cr">${Object.keys(MT).map(k=>ch(`setMet('${k}')`,MT[k][0],k==MET)).join('')}</div><div class="lgd"><span>${M[2](mn)}</span><i></i><span>${M[2](mx)}</span></div>${card}<div class="sh">Top 5 · ${M[0]}${M[1]?' (lowest)':''}</div>${top.map((t,k)=>`<div class="tr${t.id==SEL?' on':''}" onclick="selD(${t.id})"><span>${k+1}. ${t.n}</span><b>${M[2](t[MET])}</b></div>`).join('')}`}

// navigation
let cur=0;
function go(i){cur=i;$('#stage').dataset.bg=i==0?'1':'2';render(i);pages.forEach((p,k)=>p.classList.toggle('show',k==i));
 navs.forEach((b,k)=>b.classList.toggle('on',k==i));
 [...pg.children].forEach((d,k)=>d.classList.toggle('on',k==i));
 closeBMU();
 history.replaceState(null,'','#'+(i+1))}
addEventListener('keydown',e=>{if(e.key=='ArrowRight'||e.key=='PageDown')go(Math.min(8,cur+1));if(e.key=='ArrowLeft'||e.key=='PageUp')go(Math.max(0,cur-1))});
function fit(){const s=Math.min(innerWidth/1456,innerHeight/819),st=$('#stage');
 SC=s;st.style.transform=`scale(${s}) translate(-50%,-50%)`;st.style.transformOrigin='0 0';
 st.style.left=(innerWidth/2)+'px';st.style.top=(innerHeight/2)+'px'}
addEventListener('resize',fit);fit();
go(Math.max(0,Math.min(8,(parseInt(location.hash.slice(1))||1)-1)));
</script>
</body>
